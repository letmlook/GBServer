# GBServer SQLite 部署 profile
#
# 与主 docker-compose.yml 的差异：
#   - 移除 postgres / redis 依赖（SQLite 是单文件，InMemoryBackend 替代 Redis）
#   - 启用 GBSERVER__DATABASE__SQLITE_MAX_DEVICES=500
#   - 数据库文件挂载到 host 上的 ./data/gbserver.db
#
# 用法：
#   docker compose -f docker-compose.sqlite.yml up -d
#
# 配套前端（Vue）：
#   cd web && npm run dev
#
# 数据备份：
#   docker compose -f docker-compose.sqlite.yml exec gbserver \
#     sqlite3 /var/lib/gbserver/gbserver.db ".backup /backup/gbserver-$(date +%F).db"

services:
  gbserver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GBSERVER_DB_FEATURE: sqlite
    image: gbserver:latest
    container_name: gbserver-sqlite
    ports:
      - "18080:18080"
      - "5060:5060/udp"
      - "5060:5060/tcp"
    environment:
      # 录像计划使用本地时间；部署在其它时区时通过 GBSERVER_TZ 覆盖。
      TZ: ${GBSERVER_TZ:-Asia/Shanghai}
      GBSERVER__SERVER__HOST: 0.0.0.0
      GBSERVER__SERVER__PORT: 18080
      # 设备可达的宿主 IPv4，用于 Via/Contact/SDP；监听仍绑定容器全网卡。
      GBSERVER__SIP__IP: ${GBSERVER_SIP_ADVERTISE_IP:?Set GBSERVER_SIP_ADVERTISE_IP to the host IPv4 reachable by devices}
      GBSERVER__SIP__BIND_IP: 0.0.0.0
      GBSERVER__SIP__PORT: 5060
      # SQLite 默认模式（无需 --features；Cargo.toml 默认即 sqlite）
      GBSERVER__DATABASE__URL: "sqlite:///var/lib/gbserver/gbserver.db?mode=rwc"
      # SQLite 设备上限（默认 500；超出需迁移到 PG）
      GBSERVER__DATABASE__SQLITE_MAX_DEVICES: "500"
      # Redis 留空 → 自动走 InMemoryBackend（StateStore 单机）
      # JWT 签名密钥：**必须**由部署方注入，没有默认值。
      # 兜底一个仓库里公开的密钥 = 任何拿到仓库的人都能伪造管理员 token
      # （HS256 对称签名，密钥即身份）。生成：openssl rand -hex 32
      GBSERVER__JWT__SECRET: ${GBSERVER_JWT_SECRET:?Set GBSERVER_JWT_SECRET to a random >=32-char string (openssl rand -hex 32)}
      # 弱密钥 / 默认密钥 → 启动即失败（容器化即生产路径）
      GBSERVER__SECURITY__STRICT: "1"
      GBSERVER__SIP__PASSWORD: ${GBSERVER_SIP_PASSWORD:-admin123}
      # ZLM 在桥接网络中，但媒体 URL 和 ICE 候选必须指向浏览器可达的宿主地址。
      GBSERVER_ZLM_PRIMARY_IP: ${GBSERVER_ZLM_IP:-${GBSERVER_SIP_ADVERTISE_IP}}
      GBSERVER_ZLM_PRIMARY_HOOK_URL: http://gbserver:18080/api/zlm/hook
      GBSERVER_ZLM_PRIMARY_RTC_EXTERN_IP: ${GBSERVER_ZLM_RTC_EXTERN_IP:-${GBSERVER_SIP_ADVERTISE_IP}}
      RUST_LOG: info,gbserver=debug
    volumes:
      - sqlitedata:/var/lib/gbserver
    networks: [gbservernet]
    restart: unless-stopped

  zlm:
    image: zlmediakit/zlmediakit:master_py
    container_name: gbserver-zlm-sqlite
    environment:
      TZ: ${GBSERVER_TZ:-Asia/Shanghai}
    ports:
      - "8080:8080"
      - "8443:8443"
      - "554:554"
      - "322:322"
      - "1935:1935"
      - "8000:8000/udp"
      - "9000:9000/udp"
      - "30000-30100:30000-30100/udp"
    volumes:
      - ./docker/zlm/config.ini:/opt/media/conf/config.ini:ro
      - zlmrecord:/opt/media/bin/www/record
      - zlmsnap:/opt/media/bin/www/snap
    networks: [gbservernet]
    restart: unless-stopped

volumes:
  sqlitedata: {}
  zlmrecord: {}
  zlmsnap: {}

networks:
  gbservernet:
    driver: bridge
