[package]
name = "gbserver"
version = "2.0.0"
edition = "2021"
description = "GBServer — GB28181 国标信令、流媒体接入与级联管理平台"

[features]
# 数据库后端：**三种方言同时编进同一个二进制**，运行时按 `database.url`
# 的 scheme 选库（sqlite / postgres / mysql）。
#
#   sqlite:  / file:        → SQLite
#   postgres: / postgresql: → PostgreSQL
#   mysql:   / mariadb:    → MySQL
#
# 三个驱动**必须同时启用** —— `db::Pool` 是运行期多态枚举，引用了三种
# 具体 pool 类型。少开会直接 `compile_error!`（见 `src/db/mod.rs`）。
#
# 运行时选择由 `src/db/dialect.rs` 的 `Dialect` 枚举承担。
default = ["sqlite", "mysql", "postgres"]
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dependencies]
# Web
axum = { version = "0.8", features = ["json", "macros", "form", "query", "ws", "multipart"] }
tower = { version = "0.5", features = ["util"], default-features = false }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"], default-features = false }
tokio = { version = "1", features = ["full"] }

# 序列化与配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库：三个驱动**同时**编进同一个二进制（见上面的 [features]），
# 运行期按 config 里 [database] url 的 scheme 选库。
sqlx = { version = "0.7", features = ["runtime-tokio", "chrono", "macros"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }

# Phase 7.6: password hashing (Argon2id, default params ~50ms)
argon2 = "0.5"

# 鉴权
jsonwebtoken = "9"
md-5 = "0.10"

# 配置
config = "0.14"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误与工具
thiserror = "1"
anyhow = "1"
rand = "0.8"
dashmap = "5"

# SIP/GB28181
quick-xml = "0.31"

# ZLM HTTP API
# `stream` 用于把 ZLM 的录像文件**边收边转发**（云录像下载/播放代理），
# 避免把整个 MP4 读进内存
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Redis
redis = { version = "0.25", features = ["aio", "tokio-comp", "connection-manager"] }

# 网络
bytes = "1"
futures-util = "0.3"
ipnetwork = "0.20"
utoipa = { version = "5.5", features = ["axum_extras", "macros"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
# 后端测试依赖
tokio = { version = "1", features = ["test-util", "macros"] }
mockall = "0.12"
wiremock = "0.5"
testcontainers = "0.14"
assert_matches = "1.5"
pretty_assertions = "1.4"
fake = "2.6"
criterion = { version = "0.5", features = ["async_tokio"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "gbserver"
path = "src/main.rs"

[[test]]
name = "sip_pending_request_integration"
path = "tests/integration/sip/integration.rs"

[[test]]
name = "cascade_integration"
path = "tests/integration/sip/cascade_integration_test.rs"

[[test]]
name = "device_simulator_test"
path = "tests/integration/sip/device_simulator_test.rs"

[[test]]
name = "sqlite_compat"
path = "tests/integration/sqlite_compat.rs"

[[test]]
name = "state_store_two_node"
path = "tests/integration/state_store_two_node.rs"

[profile.release]
lto = true
codegen-units = 1
