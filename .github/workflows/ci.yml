# GBServer CI — 编译 / 测试 / 方言门禁 / 前端构建
#
# 背景：本仓库曾因 `602036b`（未完整编译就提交的 auto-fix）叠加 `e132db2`（删除 CI）
# 而进入"无法 cargo run"的状态，靠事后人工抢救才恢复。
# 本工作流的目的就是让"提交必须能编译 + 测试必须通过"重新成为硬约束。
#
# 门禁（失败即拦截）：
#   - backend  : cargo check --all-targets + 全量测试（默认 feature 已是三驱动同编）
#   - dialect  : 三驱动同编检查 + 方言占位符守门人 + PostgreSQL/MySQL **真实库**用例
#   - frontend : vue-tsc 类型检查 + vite 生产构建
#
# 非门禁（仅报告，不拦截；见 hygiene job 的 continue-on-error）：
#   - rustfmt / clippy —— 当前基线尚未清零（353 个 clippy warning），
#     直接设为门禁会让 CI 从第一天起一直红。待清理完成后再摘掉 continue-on-error。
#
# 无需 service 容器：默认 feature 下测试完全自包含
# （349 lib + 47 集成，全部使用内存 SQLite / 进程内状态，不连接 Redis/PG/MySQL/ZLM）。

name: CI

on:
  # ⚠️ 2026-09-11 起已**暂停自动触发**（应要求：避免每次 push 都跑一遍）。
  # 目前只保留手动触发。需要时：
  #   - GitHub Actions 页面点 "Run workflow"，或
  #   - 命令行 `gh workflow run CI`
  # 注意：GitHub 层面也已停用（`gh workflow disable CI`），所以手动运行前
  # 需要先 `gh workflow enable CI`。
  #
  # 恢复 push / PR 自动触发：取消下面两行注释即可（并确保工作流已 enable）。
  # push:
  # pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 同一分支的旧运行自动取消，避免排队堆积
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端：默认 feature（= sqlite + mysql + postgres 三驱动同编），编译 + 全量测试 ──
  backend:
    name: Backend · check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo check --all-targets
        run: cargo check --all-targets --locked

      - name: cargo test
        run: cargo test --no-fail-fast --locked

  # ── 方言：三驱动同编 + 占位符守门人 + 真实库用例 ───────────────────────────
  #
  # 2026-10-25 之前这里叫 `feature-matrix`，用
  # `--no-default-features --features <sqlite|postgres|mysql>` 分三条腿各编一次。
  # 那是**改造前**的模型（三个驱动编译期互斥），改造后三个驱动**必须同时启用**
  # （`src/db/mod.rs` 有 `compile_error!` 守卫）—— 照旧跑会直接编译失败。
  #
  # 新模型下真正要防的回归变了：
  #   1. 三个驱动同编能不能过（`cargo check`）→ 留在 backend job；
  #   2. **裸 `?` 占位符**混进 PG 分支（编译期看不出来，PG 上才 syntax error）
  #      → `dialect_guard` 守门人测试；
  #   3. **方言专属的类型/语法差异**（PG 的 `COUNT(*)` 是 int8、`?` vs `$n`、
  #      `ON DUPLICATE KEY` 与 `ON CONFLICT` 的 bind 数不同）
  #      → 真实 PostgreSQL / MySQL 上跑 `#[ignore]` 的专项用例。
  dialect:
    name: Dialect · 三驱动同编 + 真实库用例
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbserver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: gbserver_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 10s
          --health-timeout 5s --health-retries 20
    env:
      # 必须是**隔离库**（用例会建表 / 插数据 / 删数据）
      TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/gbserver_test
      TEST_MYSQL_URL: mysql://root:rootpw@127.0.0.1:3306/gbserver_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: dialect

      - name: 三个驱动同编
        run: cargo check --all-targets --locked

      - name: 方言占位符守门人
        # 扫出「在 postgres 下会被编译、却仍用裸 ? 的 SQL」—— 411 处 → 0
        run: cargo test --locked --lib dialect_guard

      - name: 初始化 PostgreSQL 隔离库
        run: psql -v ON_ERROR_STOP=1 "$TEST_POSTGRES_URL" -f database/init-postgresql-2.7.4.sql

      - name: 初始化 MySQL 隔离库
        run: mysql -h 127.0.0.1 -P 3306 -uroot -prootpw gbserver_test < database/init-mysql-2.7.4.sql

      - name: 真实库专项用例（PostgreSQL / MySQL）
        # **逐个 test target 跑**，不要用 `cargo test -- --ignored` ——
        # 那会把标记为 ignore 的 doc-test 伪代码示例也拉出来跑（它们本来就跑不通）。
        run: |
          cargo test --locked \
            --test postgres_jt1078 \
            --test postgres_device_lookup \
            --test postgres_platform_channel \
            --test mysql_catalog_channel \
            --test mysql_platform_channel \
            -- --ignored

  # ── 前端：Vue 3 + Element Plus + Vite，类型检查 + 生产构建 ────────────────
  frontend:
    name: Frontend · type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      # package.json 的 build 脚本 = vue-tsc --noEmit && vite build
      - name: npm run build
        run: npm run build

  # ── 代码规范：非门禁，仅报告 ──────────────────────────────────────────────
  hygiene:
    name: Hygiene (non-blocking) · fmt + clippy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: hygiene

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # `--all-features` 现在是**正确**的用法：三个驱动本来就必须同时启用。
      # （改造前这里写着「不要用 --all-features，三选一互斥」—— 那条注释已作废。）
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
