services:
  gbserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: gbserver:latest
    container_name: gbserver
    ports:
      - "18080:18080"
      - "5060:5060/udp"
      - "5061:5061"
    environment:
      GBSERVER__SERVER__HOST: 0.0.0.0
      GBSERVER__SERVER__PORT: 18080
      GBSERVER__SIP__IP: 0.0.0.0
      GBSERVER__SIP__PORT: 5060
      GBSERVER__DATABASE__URL: postgres://postgres:postgrespw@postgres:5432/gbserver
      GBSERVER__REDIS__URL: redis://redis:6379
      GBSERVER__JWT__SECRET: ${GBSERVER_JWT_SECRET:-a7f3c9e2b1d84f6a0e8c5b2d9f1a4e7c0b3d6f9a2e5c8b1d4f7a0e3c6b9d2f5}
      GBSERVER__SIP__PASSWORD: ${GBSERVER_SIP_PASSWORD:-admin123}
      RUST_LOG: info,gbserver=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zlm:
        condition: service_started
    networks: [gbservernet]
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: gbserver-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: gbserver
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init-postgresql-2.7.4.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gbserver"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [gbservernet]
    restart: unless-stopped

  # MySQL 方言（可选）。默认 **不启动** —— 用 profile 隔离，
  # 需要验证 mysql 构建时执行：`docker compose --profile mysql up -d mysql`
  mysql:
    profiles: ["mysql"]
    image: mysql:8
    container_name: gbserver-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: gbserver
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/init-mysql-2.7.4.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [gbservernet]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gbserver-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [gbservernet]
    restart: unless-stopped

  zlm:
    image: zlmediakit/zlmediakit:master
    container_name: gbserver-zlm
    ports:
      # HTTP / HTTPS API
      - "8080:80"
      - "8443:8443"
      # RTSP / RTSPS
      - "554:554"
      - "322:322"
      # RTMP
      - "1935:1935"
      # WebRTC (UDP)
      - "8000:8000/udp"
      # SRT (UDP)
      - "9000:9000/udp"
      # RTP media for GB28181 (UDP)
      #
      # ⚠️ 这里发布的范围**必须**与 ZLM 的 `rtp_proxy.port_range` 一致。
      # 镜像里的默认值是 30000-35000，而那个端口池是 **ZLM 启动时**按 config.ini
      # 建立的 —— 运行期用 setServerConfig 改它不会让已建好的池生效。
      # 两种做法二选一：
      #   (a) 把这里的范围放开到与 ZLM 一致（如 30000-35000，注意 Docker Desktop
      #       对上千个端口映射会很吃力，本仓库实测会卡住 daemon）；
      #   (b) 【本仓库采用】挂一份 config.ini 把 ZLM 的 rtp_proxy.port_range
      #       收窄到与本文件一致 —— 见下面 zlm 服务的 volumes 挂载。
      # 后端在节点上线时会核对两者并把不一致**明确告警**（见
      # zlm/health_checker.rs 与 handlers/play.rs 的端口校验），不会再出现
      # "INVITE 200 OK 但永远收不到媒体"却毫无提示的情况。
      - "30000-30100:30000-30100/udp"
    environment:
      ZLM_HTTP_SECRET: S63648HLbxckv7YjpPTXXRTOsAVGo0Ia
    # 让容器内的 `host.docker.internal` **稳定解析到宿主机的 IPv4 网关**。
    # Docker Desktop 上该名字可能只解析出 IPv6 ULA（实测 `fdc4:f303:9324::254`），
    # 于是 ZLM 的 hook 请求（on_publish / on_record_mp4 / on_server_keepalive …）
    # 全部连不上后端 —— 平台侧表现为"录像永远不落库""节点心跳不刷新"，
    # 而两个方向的 HTTP 探测都正常，极难排查。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 用仓库里的 config.ini 覆盖镜像默认配置：**只**为把 rtp_proxy.port_range
      # 收窄到与上面发布的 UDP 范围一致（镜像默认 30000-35000，而该端口池是
      # ZLM 启动时建立的，运行期改不生效）。不同步这份文件，GB28181 收流端口
      # 就可能落在未映射的端口上 —— 现象是 "INVITE 200 OK 但一直等不到媒体"。
      # 后端启动时会核对并告警（见 handlers/play.rs）。
      - ./docker/zlm/config.ini:/opt/media/conf/config.ini:ro
    networks: [gbservernet]
    restart: unless-stopped

volumes:
  mysqldata:
  pgdata: {}
  redisdata: {}

networks:
  gbservernet:
    driver: bridge